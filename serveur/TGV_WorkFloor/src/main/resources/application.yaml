spring:
  application:
    name: TGV_WorkFloor
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tgv_local}
    username: ${DB_USER:tgv_app}
    password: ${DB_PASSWORD:tgv_app}
  flyway:                              # migrations appliquées au démarrage, avant Hibernate
    locations: classpath:db/migration  # copiées depuis bdd/migrations au build (voir pom.xml)
    fail-on-missing-locations: true    # pas de démarrage si les migrations n'ont pas été copiées
    validate-migration-naming: true    # un fichier mal nommé fait échouer au lieu d'être ignoré
  jpa:
    hibernate:
      ddl-auto: validate   # voir le point 4
    open-in-view: false  
