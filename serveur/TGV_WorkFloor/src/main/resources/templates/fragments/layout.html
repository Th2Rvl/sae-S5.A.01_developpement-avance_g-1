<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' · T.G.V'">T.G.V</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
    <link rel="stylesheet" th:href="@{/css/tgv.css}">
</head>
<body>

<!-- Barre « Tournée du jour » et ses onglets Colis / Carte / Boucle (maquettes 02, 04, 05). -->
<header th:fragment="barre-tournee(onglet)" class="barre">
    <div class="barre-haut">
        <div class="barre-titre">
            <strong>Tournée du jour</strong>
            <small th:if="${tournee != null}"
                   th:text="${#strings.capitalize(#temporals.format(tournee.date, 'EEEE d MMMM yyyy'))}">Jeudi 1 octobre 2026</small>
        </div>
        <form th:action="@{/deconnexion}" method="post">
            <button type="submit" class="petit-bouton">Se déconnecter</button>
        </form>
    </div>
    <nav class="onglets" th:if="${tournee != null}">
        <a th:href="@{/chauffeur}" th:classappend="${onglet == 'colis'} ? 'actif'">Colis</a>
        <a th:href="@{/chauffeur/carte}" th:classappend="${onglet == 'carte'} ? 'actif'">Carte</a>
        <a th:href="@{/chauffeur/boucle}" th:classappend="${onglet == 'boucle'} ? 'actif'">Boucle</a>
    </nav>
</header>

<!-- Barre avec flèche de retour (maquettes 03 et 07). -->
<header th:fragment="barre-retour(titre, retour)" class="barre">
    <div class="barre-haut">
        <a class="retour" th:href="@{${retour}}" aria-label="Retour">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="barre-titre"><strong th:text="${titre}">Ordre manuel</strong></div>
    </div>
</header>

<div th:fragment="messages" th:remove="tag">
    <div class="alerte succes" th:if="${succes}" th:text="${succes}" role="status">Succès</div>
    <div class="alerte erreur" th:if="${erreur}" th:text="${erreur}" role="alert">Erreur</div>
</div>

<svg th:fragment="camion" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
</svg>

<svg th:fragment="colis" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4l16-.02V7z"/>
</svg>

<svg th:fragment="lieu" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
</svg>

<svg th:fragment="telephone" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
</svg>

<svg th:fragment="haut" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/>
</svg>

<svg th:fragment="bas" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/>
</svg>

</body>
</html>
