<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' · T.G.V Atelier'">T.G.V Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
    <link rel="stylesheet" th:href="@{/css/atelier.css}">
    <script th:src="@{/js/atelier.js}" defer></script>
</head>
<body>

<header th:fragment="entete" class="entete">
    <a class="marque" th:href="@{/atelier}">
        <span class="logo" th:insert="~{fragments/layout :: camion}"></span>
        <span><strong>T.G.V</strong><small>Tournée Générale Véloce · Atelier</small></span>
    </a>
    <nav>
        <a th:href="@{/atelier}" th:classappend="${uri == '/atelier'} ? 'actif'">Tableau de bord</a>
        <a th:href="@{/atelier/clients}"
           th:classappend="${#strings.startsWith(uri, '/atelier/clients')} ? 'actif'">Clients</a>
        <a th:href="@{/atelier/commandes}"
           th:classappend="${#strings.startsWith(uri, '/atelier/commandes')} ? 'actif'">Commandes</a>
        <a th:href="@{/atelier/tournees}"
           th:classappend="${#strings.startsWith(uri, '/atelier/tournees')} ? 'actif'">Tournées</a>
        <a th:href="@{/atelier/bons}"
           th:classappend="${#strings.startsWith(uri, '/atelier/bons')} ? 'actif'">Bons de livraison</a>
        <a th:href="@{/atelier/utilisateurs}"
           th:classappend="${#strings.startsWith(uri, '/atelier/utilisateurs')} ? 'actif'">Comptes</a>
    </nav>
    <form class="deconnexion" th:action="@{/deconnexion}" method="post">
        <span th:text="${utilisateurConnecte}">atelier</span>
        <button type="submit" class="petit">Déconnexion</button>
    </form>
</header>

<div th:fragment="messages">
    <div class="alerte succes" th:if="${succes}" th:text="${succes}" role="status">Succès</div>
    <div class="alerte erreur" th:if="${erreur}" th:text="${erreur}" role="alert">Erreur</div>
</div>

<svg th:fragment="camion" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
</svg>

</body>
</html>
