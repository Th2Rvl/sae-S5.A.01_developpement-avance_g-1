<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clients')}"></head>
<body>
<header th:replace="~{fragments/layout :: entete}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <div class="titre-page">
        <div>
            <h1>Clients</h1>
            <p><span th:text="${clients.size()}">10</span> clients, chacun avec une adresse de livraison unique.</p>
        </div>
        <a class="bouton principal" th:href="@{/atelier/clients/nouveau}">Nouveau client</a>
    </div>

    <section class="carte">
        <div class="tableau-conteneur">
            <table>
                <thead><tr><th>Nom</th><th>Adresse de livraison</th><th>Téléphone</th><th>Commandes</th><th></th></tr></thead>
                <tbody>
                <tr th:each="entree : ${clients}" th:with="c=${entree.key}">
                    <td><strong th:text="${c.nom}">Métallerie Causse</strong></td>
                    <td>
                        <span th:text="${c.adresse}">12 rue des Forges</span><br>
                        <span class="secondaire petit" th:text="${c.codePostal + ' ' + c.ville}">12850 Onet-le-Château</span>
                    </td>
                    <td class="nowrap" th:text="${c.telephone} ?: '—'">05 65 …</td>
                    <td>
                        <a th:if="${entree.value > 0}" th:href="@{/atelier/commandes}" th:text="${entree.value}">2</a>
                        <span th:if="${entree.value == 0}" class="secondaire">0</span>
                    </td>
                    <td>
                        <div class="actions">
                            <a class="bouton petit" th:href="@{/atelier/commandes/nouvelle(clientId=${c.id})}">Commande</a>
                            <a class="bouton petit" th:href="@{/atelier/clients/{id}(id=${c.id})}">Modifier</a>
                            <form class="en-ligne" th:action="@{/atelier/clients/{id}/suppression(id=${c.id})}" method="post"
                                  th:data-confirmation="|Supprimer le client ${c.nom} ?|">
                                <button type="submit" class="petit danger">Supprimer</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${clients.isEmpty()}"><td class="vide" colspan="5">Aucun client.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
