<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bons de livraison')}"></head>
<body>
<header th:replace="~{fragments/layout :: entete}"></header>
<main class="page">
    <div class="titre-page">
        <div>
            <h1>Bons de livraison</h1>
            <p>Suivi des colis remis par les chauffeurs (bons établis depuis l'application mobile).</p>
        </div>
    </div>
    <section class="carte">
        <div class="tableau-conteneur">
            <table>
                <thead>
                <tr><th>Bon</th><th>Date</th><th>Client</th><th>Colis</th><th>État</th><th>Commentaire</th><th>Chauffeur</th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bons}">
                    <td class="mono"><a th:href="@{/atelier/tournees/{id}(id=${b.tournee.id})}" th:text="${b.numero}">BL-20261001-03</a></td>
                    <td class="nowrap" th:text="${#temporals.format(b.dateHeure, 'dd/MM/yyyy HH:mm')}">01/10/2026 09:20</td>
                    <td th:text="${b.client.nom}">Client</td>
                    <td>
                        <span th:each="c, it : ${b.colis}">
                            <span class="mono petit" th:text="${c.reference}">C-0418</span>
                            <span class="chip" th:classappend="${c.statut.name()}" th:text="${c.statut.libelle}">Livré</span><br th:unless="${it.last}">
                        </span>
                    </td>
                    <td><span class="chip" th:classappend="${b.etat.name()}" th:text="${b.etat.libelle}">Conforme</span></td>
                    <td class="petit" th:text="${b.commentaire} ?: '—'">—</td>
                    <td th:text="${b.chauffeur != null} ? ${b.chauffeur.nom} : '—'">Chauffeur 01</td>
                </tr>
                <tr th:if="${bons.isEmpty()}"><td class="vide" colspan="7">Aucun bon de livraison.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
