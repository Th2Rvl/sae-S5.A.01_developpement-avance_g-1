<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier la pièce')}"></head>
<body>
<header th:replace="~{fragments/layout :: entete}"></header>
<main class="page">
    <div class="titre-page">
        <div>
            <h1>Pièce <span class="mono" th:text="${pieceModifiee.reference}">P-2031</span></h1>
            <p>Commande <span class="mono" th:text="${pieceModifiee.commande.reference}">CMD-0187</span> ·
                <span th:text="${pieceModifiee.commande.client.nom}">Client</span></p>
        </div>
        <a class="bouton" th:href="@{/atelier/commandes/{id}(id=${pieceModifiee.commande.id})}">Retour à la commande</a>
    </div>

    <div class="alerte attention" th:if="${pieceModifiee.colis != null}">
        Cette pièce est emballée dans le colis <span class="mono" th:text="${pieceModifiee.colis.reference}">C-0412</span> :
        changer son poids invalide la boucle de la tournée qui le contient.
    </div>

    <form class="carte formulaire" method="post" th:object="${piece}" style="max-width:640px"
          th:action="@{/atelier/commandes/pieces/{id}(id=${pieceModifiee.id})}">
        <div class="champ" th:classappend="${#fields.hasErrors('designation')} ? 'invalide'">
            <label for="designation">Désignation</label>
            <input id="designation" th:field="*{designation}" required maxlength="120">
            <span class="erreur-champ" th:errors="*{designation}"></span>
        </div>
        <div class="champ" th:classappend="${#fields.hasErrors('poidsKg')} ? 'invalide'">
            <label for="poidsKg">Poids (kg)</label>
            <input id="poidsKg" th:field="*{poidsKg}" type="number" step="0.1" min="0.1" required>
            <span class="erreur-champ" th:errors="*{poidsKg}"></span>
        </div>
        <p class="secondaire petit">L'état de fabrication se change directement dans la liste des pièces de la commande.</p>
        <div class="actions"><button type="submit" class="principal">Enregistrer</button></div>
    </form>
</main>
</body>
</html>
