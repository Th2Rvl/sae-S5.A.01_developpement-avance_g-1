<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Commandes')}"></head>
<body>
<header th:replace="~{fragments/layout :: entete}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <div class="titre-page">
        <div>
            <h1>Commandes</h1>
            <p>L'état d'une commande est celui de sa pièce la moins avancée.</p>
        </div>
        <div class="actions">
            <form method="get" th:action="@{/atelier/commandes}" class="actions">
                <select name="etat" class="compact" onchange="this.form.submit()" aria-label="Filtrer par état">
                    <option value="">Tous les états</option>
                    <option th:each="e : ${etats}" th:value="${e.name()}" th:text="${e.libelle}"
                            th:selected="${e == etatFiltre}">À faire</option>
                </select>
            </form>
            <a class="bouton principal" th:href="@{/atelier/commandes/nouvelle}">Nouvelle commande</a>
        </div>
    </div>

    <section class="carte">
        <div class="tableau-conteneur">
            <table>
                <thead>
                <tr><th>Commande</th><th>Client</th><th>Livraison prévue</th><th>Pièces</th><th>Colis</th>
                    <th class="droite">Poids</th><th>État</th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${commandes}">
                    <td class="mono"><a th:href="@{/atelier/commandes/{id}(id=${c.id})}" th:text="${c.reference}">CMD-0187</a></td>
                    <td th:text="${c.client.nom}">Métallerie Causse</td>
                    <td class="nowrap" th:text="${#temporals.format(c.datePrevue, 'EEE d MMMM yyyy')}">jeu. 1 octobre 2026</td>
                    <td th:text="${c.pieces.size()}">3</td>
                    <td th:text="${c.colis.size()}">1</td>
                    <td class="droite nowrap" th:text="${#numbers.formatDecimal(c.poidsTotalKg, 1, 'WHITESPACE', 0, 'COMMA')} + ' kg'">62 kg</td>
                    <td><span class="chip" th:classappend="${c.etat.name()}" th:text="${c.etat.libelle}">Fabriquée</span></td>
                </tr>
                <tr th:if="${commandes.isEmpty()}"><td class="vide" colspan="7">Aucune commande.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
