<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
<div class="page-connexion">
    <div class="bandeau-connexion">
        <div class="interieur">
            <span class="logo" th:insert="~{fragments/layout :: camion}"></span>
            <h1>T.G.V</h1>
            <p>Tournée Générale Véloce · Atelier</p>
        </div>
    </div>
    <div class="corps-connexion">
        <h2>Connexion atelier</h2>
        <div class="alerte erreur" th:if="${param.erreur}">Identifiant ou mot de passe incorrect.</div>
        <div class="alerte info" th:if="${param.deconnecte}">Vous êtes déconnecté.</div>
        <form class="formulaire" th:action="@{/connexion}" method="post">
            <div class="champ">
                <label for="identifiant">Identifiant</label>
                <input id="identifiant" name="identifiant" autocomplete="username" required autofocus>
            </div>
            <div class="champ">
                <label for="motDePasse">Mot de passe</label>
                <input id="motDePasse" name="motDePasse" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="principal">Se connecter</button>
        </form>
        <p class="secondaire petit">Mode statique : compte de démonstration <span class="mono">atelier</span> /
            <span class="mono">atelier</span>.</p>
    </div>
</div>
</body>
</html>
